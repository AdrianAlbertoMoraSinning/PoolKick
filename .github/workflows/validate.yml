name: Validate PoolKick
on:
  pull_request:
    branches: [main]
  push:
    branches: [marlon-v3-live-results-rankings-fix-pools]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
